name: Online Food ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train online food model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction application tests
        run: python -m unittest test_app -v

      - name: Create sample prediction request
        run: |
          python - <<'EOF'
          import json
          import joblib
          import pandas as pd

          model = joblib.load("online_food_model.pkl")
          features = list(model.feature_names_in_)
          df = pd.read_csv("onlinefoods.csv")
          sample = json.loads(df[features].iloc[0].to_json())
          with open("sample_request.json", "w") as f:
              json.dump(sample, f)
          print("Sample request:", sample)
          EOF

      - name: Build Docker image
        run: docker build -t online-food-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name online-food-ml-container \
            -p 5000:5000 \
            online-food-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/; then
              echo ""
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs online-food-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d @sample_request.json \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs online-food-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f online-food-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp online_food_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Online Food Reorder Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: online-food-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: online-food-ml-artifacts
          path: |
            online_food_model.pkl
            metrics.json
            test_predictions.csv
          if-no-files-found: error
          retention-days: 7
